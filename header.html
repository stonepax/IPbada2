<header>
  <div class="header-inner">
    <a href="index.html" class="logo"><span class="mark"></span>IP바다</a>
    <!-- 이 안의 실제 메뉴 항목은 app.js의 SITE_NAV 하나에서 렌더링된다
         (initHeaderUI -> renderNavHTML). index.html의 SERVICES 카드 그리드도
         같은 SITE_NAV를 쓰므로, 메뉴를 고칠 땐 app.js만 고치면 된다 --
         여기에 메뉴 항목을 직접 하드코딩하지 말 것. -->
    <nav class="main-nav"></nav>
    <div class="header-actions" id="auth-actions">
      <a class="btn btn-ghost" href="#login" data-auth-open="login">로그인</a>
      <a class="btn btn-primary" href="#signup" data-auth-open="signup">무료 회원가입</a>
      <button class="hamburger" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<div class="modal-overlay" id="auth-modal">
  <div class="modal-box">
    <button class="modal-close" id="auth-modal-close" type="button" aria-label="닫기">✕</button>
    <div class="modal-tabs">
      <button type="button" class="active" data-tab="login">로그인</button>
      <button type="button" data-tab="signup">회원가입</button>
    </div>
    <form class="auth-form active" id="login-form" data-form="login">
      <input type="email" name="email" placeholder="이메일" required>
      <input type="password" name="password" placeholder="비밀번호" required>
      <a href="#" id="forgot-password-toggle" style="align-self:flex-end;font-size:12.5px;color:var(--muted);">비밀번호를 잊으셨나요?</a>
      <button type="submit" class="btn btn-primary">로그인</button>
      <p class="auth-msg" id="login-msg"></p>
    </form>
    <form class="auth-form" id="signup-form" data-form="signup">
      <input type="email" name="email" placeholder="이메일" required>
      <input type="password" name="password" placeholder="비밀번호 (6자 이상)" required minlength="6">
      <button type="submit" class="btn btn-primary">무료 회원가입</button>
      <p class="auth-msg" id="signup-msg"></p>
    </form>
    <form class="auth-form" id="reset-form" data-form="reset">
      <p style="font-size:13px;color:var(--muted);">가입하신 이메일로 비밀번호 재설정 링크를 보내드립니다.</p>
      <input type="email" name="email" placeholder="이메일" required>
      <button type="submit" class="btn btn-primary">재설정 링크 받기</button>
      <p class="auth-msg" id="reset-msg"></p>
      <a href="#" id="back-to-login-toggle" style="text-align:center;font-size:12.5px;color:var(--blue);font-weight:700;">← 로그인으로 돌아가기</a>
    </form>
  </div>
</div>
