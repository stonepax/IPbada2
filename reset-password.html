<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 재설정 | IP바다</title>
<link rel="stylesheet" href="styles.css">
</head>
<body style="background:var(--bg-alt);min-height:100vh;display:flex;align-items:center;justify-content:center;">

<div class="modal-box" style="max-width:400px;width:100%;margin:24px;">
  <a href="index.html" class="logo" style="display:flex;justify-content:center;margin-bottom:20px;"><span class="mark"></span>IP바다</a>
  <h3 style="text-align:center;margin-bottom:8px;">새 비밀번호 설정</h3>
  <p id="status-msg" class="auth-msg" style="text-align:center;">링크를 확인하는 중입니다...</p>
  <form id="reset-password-form" class="auth-form" style="display:none;">
    <input type="password" name="password" placeholder="새 비밀번호 (6자 이상)" required minlength="6">
    <input type="password" name="password2" placeholder="새 비밀번호 확인" required minlength="6">
    <button type="submit" class="btn btn-primary">비밀번호 변경</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  // 이 페이지는 비밀번호 재설정 이메일의 링크로만 들어오는 화면이라,
  // 다른 페이지들과 달리 헤더/로그인 모달(app.js) 없이 완전히 독립적으로 동작합니다.
  var SUPABASE_URL = 'https://guofrvaebojjalmidoxg.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_5cc3UHFZCe-BgCuiBZO64Q_12OI7yQc';
  var supabaseClient = null;
  try { supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(err) { console.error('Supabase 초기화 실패:', err); }

  var formEl = document.getElementById('reset-password-form');
  var statusEl = document.getElementById('status-msg');
  var ready = false;

  function showForm(){
    ready = true;
    formEl.style.display = 'flex';
    statusEl.style.display = 'none';
  }
  function showInvalid(){
    statusEl.textContent = '유효하지 않거나 만료된 링크입니다. 로그인 화면에서 "비밀번호를 잊으셨나요?"를 다시 눌러주세요.';
    statusEl.className = 'auth-msg error';
  }

  if(supabaseClient){
    // 재설정 이메일의 링크를 타고 들어오면 supabase-js가 URL의 토큰을 자동으로 읽어
    // 임시 세션을 만들고 'PASSWORD_RECOVERY' 이벤트를 발생시킵니다.
    supabaseClient.auth.onAuthStateChange(function(event){
      if(event === 'PASSWORD_RECOVERY') showForm();
    });
    setTimeout(function(){
      if(!ready){
        supabaseClient.auth.getSession().then(function(res){
          if(res.data.session) showForm(); else showInvalid();
        });
      }
    }, 1500);
  } else {
    statusEl.textContent = '서비스에 연결할 수 없습니다.';
    statusEl.className = 'auth-msg error';
  }

  formEl.addEventListener('submit', async function(e){
    e.preventDefault();
    var pw1 = formEl.password.value, pw2 = formEl.password2.value;
    statusEl.style.display = 'block';
    if(pw1 !== pw2){
      statusEl.textContent = '비밀번호가 일치하지 않습니다.';
      statusEl.className = 'auth-msg error';
      return;
    }
    var btn = formEl.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = '변경 중...';
    var result = await supabaseClient.auth.updateUser({ password: pw1 });
    if(result.error){
      statusEl.textContent = result.error.message;
      statusEl.className = 'auth-msg error';
      btn.disabled = false; btn.textContent = '비밀번호 변경';
    } else {
      formEl.style.display = 'none';
      statusEl.innerHTML = '비밀번호가 변경되었습니다. <a href="index.html" style="color:var(--blue);font-weight:700;">이제 로그인하러 가기 →</a>';
      statusEl.className = 'auth-msg success';
    }
  });
</script>

</body>
</html>
